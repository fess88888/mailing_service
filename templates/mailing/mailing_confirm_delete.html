{% extends "base.html" %}
{% block title %}Удаление рассылки{% endblock %}
{% block content %}
<h2>Удалить рассылку?</h2>
<p class="text-danger">Вы уверены, что хотите удалить рассылку #{{ object.pk }} ({{ object.message.subject }})?</p>
<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
