{% extends "base.html" %}
{% block title %}Удаление получателя{% endblock %}
{% block content %}
<h2>Удалить получателя?</h2>
<p class="text-danger">Вы уверены, что хотите удалить «{{ object.full_name }}» ({{ object.email }})?</p>
<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:recipient_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
